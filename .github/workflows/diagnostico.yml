name: Diagnóstico del arranque

on:
  workflow_dispatch:

jobs:
  diagnostico:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Herramientas
        run: sudo apt-get update && sudo apt-get install -y xorriso squashfs-tools wget initramfs-tools-core zstd
      - name: Comparar initrd
        run: sudo ./tools/diagnostico-initrd.sh

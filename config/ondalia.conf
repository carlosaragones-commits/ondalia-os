# Configuración general de Ondalia OS.
# build.sh carga este archivo; cualquier variable se puede sobrescribir
# desde el entorno, por ejemplo: VERSION=0.2 sudo ./build.sh

: "${DISTRO_NAME:=Ondalia OS}"
: "${DISTRO_ID:=ondalia}"
: "${VERSION:=0.1}"
: "${CODENAME:=Primera Ola}"

# ISO base: Kubuntu 26.04 LTS (Resolute Raccoon).
# Se toma siempre la última versión puntual publicada en este directorio
# y se verifica con su SHA256SUMS.
: "${BASE_URL:=https://cdimage.ubuntu.com/kubuntu/releases/resolute/release}"
: "${BASE_ISO_PATTERN:=desktop-amd64.iso}"

# Nombre del volumen de la ISO (máximo 32 caracteres, sin espacios).
: "${ISO_LABEL:=ONDALIA_OS_${VERSION//./_}}"

# Compresión del sistema de archivos de la ISO: xz (más pequeña, más lenta)
# o zstd (más rápida de compilar y de arrancar).
: "${SQUASHFS_COMP:=zstd}"

# Idioma y región por defecto.
: "${DEFAULT_LOCALE:=es_ES.UTF-8}"
: "${DEFAULT_KEYMAP:=es}"
: "${DEFAULT_TIMEZONE:=Europe/Madrid}"

# Carpeta de trabajo (necesita unos 25 GB libres).
: "${WORK_DIR:=$PWD/work}"
: "${OUT_DIR:=$PWD/out}"
